services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: cfp_backend
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer_cache:/tmp/composer-cache
    ports:
      - "8000:8000"
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-cfp_backend}
      DB_USERNAME: ${DB_USERNAME:-cfp_backend}
      DB_PASSWORD: ${DB_PASSWORD:-cfp_backend}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  postgres:
    image: postgres:16-alpine
    container_name: cfp_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cfp_backend
      POSTGRES_USER: cfp_backend
      POSTGRES_PASSWORD: cfp_backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfp_backend -d cfp_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    container_name: cfp_postgres_test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cfp_backend_testing
      POSTGRES_USER: cfp_backend_testing
      POSTGRES_PASSWORD: cfp_backend_testing
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfp_backend_testing -d cfp_backend_testing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  composer_cache:
  postgres_data:
  postgres_test_data:
